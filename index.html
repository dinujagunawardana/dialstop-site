<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dial Stop</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a12;
      --panel: #121422;
      --text: #f7f7fb;
      --muted: #a6a8b8;
      --gold: #ffd700;
      --pink: #ff3da5;
      --cyan: #36b7f6;
      --green: #18d4a2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 30%, #1b1d31 0, var(--bg) 58%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    main {
      width: min(760px, 100%);
      text-align: center;
    }

    .app-icon {
      width: min(300px, 76vw);
      aspect-ratio: 1;
      margin: 0 auto 28px;
      border-radius: 22%;
      display: block;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    nav {
      margin-top: 30px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="app-icon.png" alt="Dial Stop app icon">
    <h1>Dial Stop</h1>
    <p>A fast one-tap arcade game about timing, color matching, coins, and chasing one more perfect stop.</p>
    <nav>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
